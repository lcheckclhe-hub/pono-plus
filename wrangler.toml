name = "pono-plus"
main = "src/index.ts"
compatibility_date = "2026-08-14"
compatibility_flags = ["nodejs_compat"]

# ------------------------------------------------------------------
# ⚠ Workers Free の CPU 制限では scrypt（実測約400ms）が通らない。
#    Paid 前提であることは改修設計書 5.5⑥ で確認済み。
#
# 🔴 環境を [env.dev] などに分けず、トップレベルに書いている。
#    理由: GitHub 連携のデプロイコマンドが既定で
#         「npx wrangler deploy」（--env 指定なし）であり、
#         [env.dev] に書くと D1/R2 のバインドが読まれないため
#         （2026-08-15 実機で bindings.db=false を確認）。
#    staging / production を追加する際は、Worker とリポジトリを分けるか、
#    デプロイコマンドの変更をあわせて検討すること。
# ------------------------------------------------------------------

[[d1_databases]]
binding = "DB"
database_name = "pono-plus-dev"
database_id = "d65519b4-cf84-4ddf-91bb-e32c976d921a"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "pono-plus-photos-dev"

[observability]
enabled = true

# ⚠ ログに個人データ・SQL 全文を出さないこと。
#    現行は debug.log（1.28GB）を公開ディレクトリに置き、SQL 全文と
#    従業員ID・会社IDを追記していた（改修設計書 6.1）。
